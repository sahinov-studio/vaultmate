[package]
name = "vaultmate"
version = "1.0.0"
description = "VaultMate — Local Credentials Manager"
authors = ["VaultMate Contributors"]
license = "MIT"
repository = "https://github.com/bittuai/vaultmate"
edition = "2021"

[lib]
name = "vaultmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
auto-launch = "0.5"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
base32 = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
